name: Continous integration

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "*"

permissions:
  contents: read

jobs:
  check_format:
    env:
      CLANGFORMAT: clang-format-18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Install clang-format-18
        run: |
          sudo apt update -y
          sudo apt install -y clang-format-18
      - name: Run format check
        run: bash tools/check_format.sh

  run_tests_unix:
    needs: check_format
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel  # x86_64
          - macos-15  # arm64
        assembler:
          - nasm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies (Linux)
        run: sudo apt update -y && sudo apt install ${{ matrix.assembler }}
        if: runner.os == 'Linux'
      - name: Untap untrusted taps (macOS)
        run: brew untap aws/tap || true
        if: runner.os == 'macOS'
      - name: Install build dependencies (Macos)
        run: brew install ${{ matrix.assembler }} automake autoconf coreutils libtool
        if: runner.os == 'macOS'
      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix ${HOME}/.local
          bash -c 'make -j $(nproc)'
      - name: Run tests
        run: bash tools/test_checks.sh
      - name: Run extended tests
        run: bash tools/test_extended.sh

  run_tests_linux_arm64:
    needs: check_format
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix ${HOME}/.local
          bash -c 'make -j $(nproc)'
      - name: Run tests
        run: bash tools/test_checks.sh
      - name: Run extended tests
        run: bash tools/test_extended.sh

  run_tests_mingw_linux_64:
    needs: check_format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies (Linux)
        run: sudo apt update -y && sudo apt install nasm mingw-w64
      - name: Build
        shell: bash
        run: |
          make -j $(nproc) -f Makefile.unx programs/igzip tests arch=mingw host_cpu=x86_64
      # wine does not seem available, hence cannot run tests.

  run_tests_mingw_linux_32:
    needs: check_format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies (Linux)
        run: sudo apt update -y && sudo apt install nasm mingw-w64
      - name: Build
        shell: bash
        run: |
          make -j $(nproc) -f Makefile.unx programs/igzip tests arch=mingw host_cpu=base_aliases CC=i686-w64-mingw32-gcc

  run_tests_mingw_windows_64:
    needs: check_format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install nasm
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Build
        shell: bash
        run: |
          make -j $(nproc) -f Makefile.unx programs/igzip tests SIM= arch=mingw host_cpu=x86_64 AR=x86_64-w64-mingw32-gcc-ar
      - name: Run tests
        shell: bash
        run: |
          # autoconf is missing, hence simulates test_checks.sh
          make -j $(nproc) -f Makefile.unx check D=TEST_SEED=0 SIM= arch=mingw host_cpu=x86_64 AR=x86_64-w64-mingw32-gcc-ar
      - name: Run extended tests
        shell: bash
        run: |
          # simulates test_extended.sh
          make -j $(nproc) -f Makefile.unx perf D=TEST_SEED=0 SIM= arch=mingw host_cpu=x86_64 AR=x86_64-w64-mingw32-gcc-ar
          make -j $(nproc) -f Makefile.unx test D=TEST_SEED=0 SIM= arch=mingw host_cpu=x86_64 AR=x86_64-w64-mingw32-gcc-ar

  # seems like i686-w64-mingw32-gcc is not available on windows runner.

  run_tests_windows:
    needs: check_format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install nasm
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Build
        run: |
          nmake -f Makefile.nmake || exit /b 1
          nmake checks -f Makefile.nmake || exit /b 1
          nmake perfs -f Makefile.nmake || exit /b 1
      - name: Run perf apps
        run: nmake perf -f Makefile.nmake || exit /b 1
      - name: Run checks
        run: nmake check -f Makefile.nmake || exit /b 1

  run_tests_linux-riscv64-v:
    needs: check_format
    # The cross compiler and libraries target RVA23 by default, so emulate RVA23 CPUs
    # with the extensions and vector lengths that select each implementation
    strategy:
      fail-fast: false
      matrix:
        include:
          # VLEN=128 selects adler32_rvv128, other VLENs select adler32_rvv
          - name: vlen128-zvbc-ubsan
            qemu_cpu: rva23u64,vlen=128,zbc=true,zvbc=true
            cflags: -g -O2 -fsanitize=undefined -fno-sanitize=nonnull-attribute -fsanitize-undefined-trap-on-error
          - name: vlen256-zvbc
            qemu_cpu: rva23u64,vlen=256,zbc=true,zvbc=true
            cflags: -g -O2
          # RVV without vector CRC
          - name: vlen512
            qemu_cpu: rva23u64,vlen=512
            cflags: -g -O2
          # Base functions, built without V so that the compiler does not vectorize
          - name: base
            qemu_cpu: rva23u64,v=false
            cflags: -g -O2 -march=rv64gc_zba_zbb_zbs
    name: run_tests_linux-riscv64-v (${{ matrix.name }})
    runs-on: ubuntu-26.04
    env:
      QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
      QEMU_CPU: ${{ matrix.qemu_cpu }}
      CFLAGS: ${{ matrix.cflags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        run: sudo apt update -y && sudo apt install -y gcc-riscv64-linux-gnu qemu-user-binfmt
      - name: Build
        run: |
          ./autogen.sh
          ./configure --host=riscv64-linux-gnu
          bash -c 'make -j $(nproc)'
      - name: Run tests
        # cross build, hence simulates test_checks.sh
        run: bash -c 'make -j $(nproc) check D="-D TEST_SEED=0"'
      - name: Run unit tests
        # all unit tests but erasure_code_base_test, which only tests the base functions
        # and takes too long under emulation
        run: >-
          bash -c 'make -j $(nproc) D="-D TEST_SEED=0"
          erasure_code/gf_vect_mul_base_test.run erasure_code/gf_vect_dot_prod_base_test.run
          erasure_code/gf_vect_dot_prod_test.run erasure_code/gf_vect_mad_test.run'

  run_cmake_tests_unix:
    needs: check_format
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel  # x86_64
          - macos-15  # arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies (Linux)
        run: sudo apt update -y && sudo apt install nasm zlib1g-dev
        if: runner.os == 'Linux'
      - name: Untap untrusted taps (macOS)
        run: brew untap aws/tap || true
        if: runner.os == 'macOS'
      - name: Install build dependencies (macOS)
        run: brew install nasm zlib
        if: runner.os == 'macOS'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  run_cmake_tests_linux_arm64:
    needs: check_format
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        run: sudo apt update -y && sudo apt install zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  run_cmake_tests_linux-riscv64:
    needs: check_format
    runs-on: ubuntu-26.04
    env:
      QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
      # The cross compiler and libraries target RVA23 by default
      QEMU_CPU: rva23u64,zbc=true,zvbc=true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        # riscv64 zlib comes from the ports archive, the default archive only has amd64.
        # Keep amd64v3, the runner's architecture variant, in the default archive sources.
        run: |
          sudo dpkg --add-architecture riscv64
          sudo sed -i '/^Types: deb/a Architectures: amd64 amd64v3' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: resolute resolute-updates\nComponents: main\nArchitectures: riscv64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/ports-riscv64.sources
          sudo apt update -y && sudo apt install -y gcc-riscv64-linux-gnu qemu-user-binfmt zlib1g-dev:riscv64
          # the systemd trigger that registers the binfmt handlers can fail here, so register
          # the riscv64 handler directly
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-riscv64.conf
          cat /proc/sys/fs/binfmt_misc/qemu-riscv64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=riscv64 -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc
      - name: Build
        run: cmake --build build --parallel
      - name: Run smoke tests
        # quick tests only, the autotools job runs all tests under emulation
        run: ctest --test-dir build --output-on-failure -R 'gf_inverse|xor_gen|pq_gen|crc|igzip_bounds|igzip_wrapper_hdr|checksum32|version|shim_inflate'

  run_cmake_tests_windows:
    needs: check_format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install nasm
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Install zlib
        run: vcpkg install zlib:x64-windows
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
